<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gojo Satoru - Bio Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0c10;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Anime / Gojo Satoru Wallpaper */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: url('https://images.alphacoders.com/131/1312385.jpeg') center/cover no-repeat;
      filter: brightness(0.4) opacity(0.85);
      z-index: 1;
    }

    /* Main Container Card */
    .profile-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 440px;
      margin: 20px;
      background: rgba(20, 20, 28, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      text-align: center;
      padding-bottom: 24px;
    }

    /* Banner Top */
    .banner-container {
      position: relative;
      width: 100%;
      height: 140px;
      background: url('https://w0.peakpx.com/wallpaper/702/692/HD-wallpaper-gojo-satoru-jujutsu-kaisen.jpg') center/cover no-repeat;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(20,20,28,0.8) 100%);
    }

    /* Avatar Circle */
    .avatar-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: -45px auto 12px;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .status-badge {
      position: absolute;
      top: 0;
      right: 2px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 11px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.3);
    }

    /* Main Name & Badges */
    .title-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .tags-wrapper {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .tag {
      font-size: 11px;
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #ccc;
    }

    .japanese-sub {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    /* Inner Glass Card (KORNN Section) */
    .inner-card {
      width: calc(100% - 32px);
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.88);
      color: #111;
      border-radius: 16px;
      padding: 16px 20px;
      text-align: left;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .inner-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .inner-icon {
      width: 36px;
      height: 36px;
      background: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
    }

    .inner-title-group h3 {
      font-size: 15px;
      font-weight: 800;
      color: #000;
      letter-spacing: 0.5px;
    }

    .inner-stats {
      font-size: 10px;
      font-weight: 700;
      color: #666;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .inner-about {
      font-size: 11px;
      color: #777;
      text-transform: uppercase;
      margin-bottom: 2px;
      font-weight: 600;
    }

    .inner-bio {
      font-size: 13px;
      font-weight: 700;
      color: #222;
      margin-bottom: 10px;
    }

    .inner-footer {
      font-size: 10px;
      font-weight: 700;
      color: #888;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Media Play Button Overlay Effect */
    .play-btn-overlay {
      position: absolute;
      right: 25px;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(4px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* Scroll Indicator Below */
    .scroll-indicator {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    .scroll-indicator i {
      font-size: 12px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(5px); }
    }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>

  <div class="profile-card">
    <!-- Header Banner -->
    <div class="banner-container">
      <div class="banner-overlay"></div>
    </div>

    <!-- Avatar -->
    <div class="avatar-wrapper">
      <img src="https://i.pinimg.com/736x/21/d0/09/21d0092c483a9366d0344b1c1c7a23c3.jpg" alt="Avatar Gojo" class="avatar-img">
      <div class="status-badge">?</div>
    </div>

    <!-- Header Info -->
    <h1 class="title-name">DOKIDOKI</h1>
    
    <div class="tags-wrapper">
      <span class="tag"><i class="fa-solid fa-user-group"></i> REASONS</span>
      <span class="tag"><i class="fa-solid fa-shield-halved"></i> FUSIONS</span>
      <span class="tag"># るまん</span>
    </div>

    <p class="japanese-sub">明日に会えることが難しい</p>

    <!-- Inner Card (KORNN) -->
    <div class="inner-card">
      <div class="inner-header">
        <div class="inner-icon">
          <i class="fa-solid fa-mug-hot"></i>
        </div>
        <div class="inner-title-group">
          <h3>KORNN</h3>
          <div class="inner-stats">
            <i class="fa-solid fa-user-friends"></i> 100 FRIENDS &nbsp;»&nbsp; 11 FOLLOWERS
          </div>
        </div>
      </div>

      <div class="inner-about">ABOUT</div>
      <div class="inner-bio">HAHA</div>

      <div class="inner-footer">
        <i class="fa-regular fa-clock"></i> JOINED 4 YEARS AGO
      </div>

      <!-- Play Button Effect -->
      <div class="play-btn-overlay">
        <i class="fa-solid fa-play" style="margin-left: 2px;"></i>
      </div>
    </div>

    <!-- Scroll Footer -->
    <div class="scroll-indicator">
      <i class="fa-solid fa-chart-simple"></i>
      <span>SCROLL</span>
      <i class="fa-solid fa-chevron-down"></i>
    </div>
  </div>

</body>
</html>
