<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HARBLX — Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --text: #fff;
    --muted: #b9b9c8;
    --glass: rgba(15, 15, 25, .48);
    --border: rgba(255,255,255,.18);
}

html, body {
    width: 100%;
    min-height: 100%;
    font-family: Inter, sans-serif;
    color: var(--text);
    overflow-x: hidden;
}

/* ================= BACKGROUND ================= */

body {
    background: #070711;
}

.background {
    position: fixed;
    inset: 0;
    z-index: -5;

    background:
        linear-gradient(
            135deg,
            rgba(36, 17, 91, .7),
            rgba(111, 28, 148, .38),
            rgba(20, 45, 105, .65)
        ),
        url("https://images.unsplash.com/photo-1579546929518-9e396f3cc809?auto=format&fit=crop&w=2400&q=90");

    background-size: cover;
    background-position: center;

    filter: saturate(1.3);
    transform: scale(1.08);
}

.background::after {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(168, 92, 255, .3),
            transparent 35%
        ),
        linear-gradient(
            rgba(0,0,0,.18),
            rgba(0,0,0,.62)
        );

    backdrop-filter: blur(4px);
}

/* ================= LIGHTS ================= */

.light {
    position: fixed;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .3;
    z-index: -3;
    animation: float 8s ease-in-out infinite;
}

.light.one {
    background: #713cff;
    top: 5%;
    left: -100px;
}

.light.two {
    background: #e83cff;
    bottom: -100px;
    right: -80px;
    animation-delay: -3s;
}

@keyframes float {
    0%,100% {
        transform: translateY(0) scale(1);
    }

    50% {
        transform: translateY(-40px) scale(1.08);
    }
}

/* ================= PAGE ================= */

.page {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 18px;
}

/* ================= CARD ================= */

.profile {
    width: min(430px, 100%);
    padding: 34px 27px 27px;

    position: relative;

    background: var(--glass);
    border: 1px solid var(--border);
    border-radius: 30px;

    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.1);

    overflow: hidden;

    animation: cardIn .9s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.94);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* rotating border glow */

.profile::before {
    content: "";
    position: absolute;
    inset: -2px;

    background: conic-gradient(
        transparent,
        rgba(151,95,255,.7),
        transparent,
        rgba(255,75,219,.6),
        transparent
    );

    animation: rotate 7s linear infinite;
    z-index: -2;
}

.profile::after {
    content: "";
    position: absolute;
    inset: 1px;
    background: rgba(10,10,18,.82);
    border-radius: 29px;
    z-index: -1;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

/* ================= AVATAR ================= */

.avatar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
}

.avatar-ring {
    width: 105px;
    height: 105px;
    padding: 4px;

    border-radius: 50%;

    background: conic-gradient(
        #9c6cff,
        #ff4bd8,
        #53b8ff,
        #9c6cff
    );

    animation: avatarSpin 6s linear infinite;

    box-shadow:
        0 0 35px rgba(151,95,255,.55);
}

@keyframes avatarSpin {
    to {
        transform: rotate(360deg);
    }
}

.avatar {
    width: 100%;
    height: 100%;

    border-radius: 50%;
    object-fit: cover;

    border: 4px solid #11111a;

    animation: avatarReverse 6s linear infinite;
}

@keyframes avatarReverse {
    to {
        transform: rotate(-360deg);
    }
}

/* ================= NAME ================= */

.name {
    text-align: center;
    font-size: 29px;
    font-weight: 800;
    letter-spacing: -.8px;

    background: linear-gradient(
        90deg,
        #fff,
        #b894ff,
        #ff8be9,
        #fff
    );

    background-size: 250%;
    -webkit-background-clip: text;
    color: transparent;

    animation: rgbText 5s linear infinite;
}

@keyframes rgbText {
    to {
        background-position: 250%;
    }
}

.username {
    text-align: center;
    margin-top: 5px;

    color: #aaaabd;
    font-size: 13px;
}

/* ================= STATUS ================= */

.status {
    width: max-content;
    margin: 15px auto 20px;

    padding: 7px 13px;

    display: flex;
    align-items: center;
    gap: 7px;

    border-radius: 999px;

    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.1);

    color: #ddd;
    font-size: 12px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;
    background: #65ff9b;

    box-shadow: 0 0 12px #65ff9b;

    animation: pulse 1.6s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.4);
        opacity: .5;
    }
}

/* ================= BIO ================= */

.bio {
    text-align: center;
    color: #c6c6d2;

    font-size: 13px;
    line-height: 1.7;

    margin-bottom: 23px;
}

/* ================= STATS ================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;

    margin-bottom: 20px;
}

.stat {
    padding: 13px 5px;

    text-align: center;

    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);

    border-radius: 15px;

    transition: .3s;
}

.stat:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.09);
}

.stat strong {
    display: block;
    font-size: 15px;
}

.stat span {
    display: block;
    margin-top: 4px;

    color: #88889a;
    font-size: 10px;
}

/* ================= LINKS ================= */

.links {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link {
    position: relative;

    display: flex;
    align-items: center;

    min-height: 57px;
    padding: 0 16px;

    color: white;
    text-decoration: none;

    border-radius: 16px;

    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.09);

    overflow: hidden;

    transition:
        transform .3s,
        background .3s,
        border .3s;
}

.link::before {
    content: "";

    position: absolute;
    inset: 0;

    background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.09),
        transparent
    );

    transform: translateX(-100%);
    transition: .5s;
}

.link:hover::before {
    transform: translateX(100%);
}

.link:hover {
    transform: translateY(-3px);
    background: rgba(255,255,255,.09);
    border-color: rgba(173,132,255,.45);

    box-shadow:
        0 10px 30px rgba(80,30,160,.18);
}

.icon {
    width: 34px;
    height: 34px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 10px;

    background: rgba(255,255,255,.08);

    font-size: 16px;
}

.link-info {
    margin-left: 12px;
}

.link-title {
    display: block;
    font-size: 13px;
    font-weight: 600;
}

.link-sub {
    display: block;

    margin-top: 2px;

    color: #888899;
    font-size: 10px;
}

.arrow {
    margin-left: auto;
    color: #777789;
    transition: .3s;
}

.link:hover .arrow {
    color: white;
    transform: translateX(4px);
}

/* ================= FOOTER ================= */

.footer {
    text-align: center;
    margin-top: 22px;

    color: #666678;
    font-size: 10px;
}

.footer span {
    color: #a989ff;
}

/* ================= PARTICLES ================= */

.particle {
    position: fixed;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    background: white;

    opacity: .5;

    box-shadow: 0 0 10px white;

    animation: particleMove linear infinite;

    z-index: -1;
}

@keyframes particleMove {
    from {
        transform: translateY(110vh);
        opacity: 0;
    }

    15% {
        opacity: .5;
    }

    85% {
        opacity: .5;
    }

    to {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

/* ================= MOBILE ================= */

@media (max-width: 480px) {

    .page {
        padding: 20px 13px;
    }

    .profile {
        padding: 29px 18px 22px;
        border-radius: 25px;
    }

    .profile::after {
        border-radius: 24px;
    }

    .name {
        font-size: 26px;
    }

    .bio {
        font-size: 12px;
    }
}
</style>
</head>
