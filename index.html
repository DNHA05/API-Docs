<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #0d0e12; color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; overflow-x: hidden; }
    
    .profile-card {
      position: relative; z-index: 2; width: 100%; max-width: 400px; margin: 20px;
      background: rgba(18, 19, 26, 0.75); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 28px; overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7); text-align: center; padding-bottom: 24px;
    }

    /* BANNER CONTAINER */
    .banner-container {
      position: relative; 
      width: 100%; 
      aspect-ratio: 720 / 265;
      background: url('./banner.gif') center/cover no-repeat #12131a;
    }
    .banner-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(18,19,26,0.95) 100%); }

    /* AVATAR DECORATION FIT */
    .avatar-wrapper {
      position: relative; width: 86px; height: 86px; margin: -48px auto 14px;
      border-radius: 50%;
    }

    .avatar-decoration {
      position: absolute;
      top: -10px; left: -10px;
      width: 106px; height: 106px;
      pointer-events: none;
      z-index: 2;
    }

    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #222; position: relative; z-index: 1; }

    .status-badge {
      position: absolute; bottom: 2px; right: 2px; width: 18px; height: 18px;
      border-radius: 50%; border: 3px solid #12131a; background-color: #747f8d;
      z-index: 3;
    }
    .status-online { background-color: #23a55a; }
    .status-idle { background-color: #f0b232; }
    .status-dnd { background-color: #f23f43; }
    .status-offline { background-color: #747f8d; }

    .username-container { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
    .title-name { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; color: #ffffff; }

    .guild-tag {
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #5865f2; font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 4px;
    }

    .badges-container {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: rgba(0, 0, 0, 0.25); padding: 4px 10px; border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 12px; min-height: 26px;
    }

    .tags-wrapper { display: flex; justify-content: center; align-items: center; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .tag { font-size: 11px; font-weight: 600; padding: 4px 12px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; color: #d1d5db; display: flex; align-items: center; gap: 5px; }
    .japanese-sub { font-size: 12px; color: rgba(255, 255, 255, 0.55); margin-bottom: 14px; letter-spacing: 0.5px; }

    /* THANH NOW PLAYING */
    .now-playing-card {
      width: calc(100% - 32px);
      margin: 0 auto 14px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
    }
    .np-left { display: flex; align-items: center; gap: 12px; text-align: left; overflow: hidden; }
    .np-icon { font-size: 16px; color: #ffffff; flex-shrink: 0; }
    .np-info { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .np-title { font-size: 13px; font-weight: 700; color: #ffffff; overflow: hidden; text-overflow: ellipsis; }
    .np-subtitle { font-size: 11px; color: rgba(255, 255, 255, 0.45); margin-top: 1px; font-weight: 500; }

    .np-controls { display: flex; align-items: center; gap: 12px; }
    .play-btn { color: #ffffff; cursor: pointer; font-size: 15px; transition: transform 0.2s; }
    .play-btn:hover { transform: scale(1.1); }
    .next-btn { color: rgba(255, 255, 255, 0.6); cursor: pointer; font-size: 14px; transition: color 0.2s; }
    .next-btn:hover { color: #ffffff; }

    /* HIỆU ỨNG SÓNG ÂM THANH */
    .sound-wave { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex-shrink: 0; }
    .sound-wave span { width: 3px; background-color: #ffffff; border-radius: 2px; animation: bounce 1.2s ease-in-out infinite; }
    .sound-wave.paused span { animation-play-state: paused; opacity: 0.3; }
    .sound-wave span:nth-child(1) { height: 60%; animation-delay: 0.1s; }
    .sound-wave span:nth-child(2) { height: 100%; animation-delay: 0.3s; }
    .sound-wave span:nth-child(3) { height: 40%; animation-delay: 0.2s; }

    @keyframes bounce {
      0%, 100% { transform: scaleY(0.4); }
      50% { transform: scaleY(1); }
    }

    .scroll-indicator { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 5px; color: rgba(255, 255, 255, 0.45); font-size: 9px; letter-spacing: 2px; font-weight: 800; }
    .scroll-indicator i { font-size: 11px; }
  </style>
</head>
<body>

  <audio id="audio-player"></audio>

  <div class="profile-card">
    <div class="banner-container">
      <div class="banner-overlay"></div>
    </div>

    <div class="avatar-wrapper">
      <img id="avatar-deco" class="avatar-decoration" style="display: none;" alt="Deco">
      <img id="discord-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" class="avatar-img">
      <div id="status-dot" class="status-badge status-offline"></div>
    </div>

    <div class="username-container">
      <h1 id="discord-username" class="title-name">Loading...</h1>
      <span id="guild-tag" class="guild-tag" style="display: none;">
        <i class="fa-solid fa-shield-cat"></i> <span id="guild-name"></span>
      </span>
    </div>

    <div id="badges-box" class="badges-container" style="display: none;"></div>
    
    <div class="tags-wrapper">
      <span class="tag"><i class="fa-solid fa-user-group"></i> REASONS</span>
      <span class="tag"><i class="fa-solid fa-shield-halved"></i> FUSIONS</span>
      <span class="tag"># るまん</span>
    </div>

    <p class="japanese-sub">明日に会えることが難しい</p>

    <!-- THANH NOW PLAYING -->
    <div class="now-playing-card">
      <div class="np-left">
        <i class="fa-solid fa-music np-icon"></i>
        <div class="np-info">
          <div id="np-song" class="np-title">Đang quét bài hát...</div>
          <div id="np-status" class="np-subtitle">Paused</div>
        </div>
      </div>
      <div class="np-controls">
        <div id="play-btn" class="play-btn" title="Phát/Tạm dừng"><i id="play-icon" class="fa-solid fa-play"></i></div>
        <div id="next-btn" class="next-btn" title="Bài tiếp theo"><i class="fa-solid fa-forward-step"></i></div>
        <div id="wave-box" class="sound-wave paused">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>

    <div class="scroll-indicator">
      <i class="fa-solid fa-chart-simple"></i>
      <span>SCROLL</span>
      <i class="fa-solid fa-chevron-down"></i>
    </div>
  </div>

  <script>
    const DISCORD_USER_ID = "862273858214821929"; 
    const GITHUB_USER = "DNHA05";
    const GITHUB_REPO = "API-Docs";

    let playlist = [];
    let currentTrack = 0;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const nextBtn = document.getElementById('next-btn');
    const playIcon = document.getElementById('play-icon');
    const waveBox = document.getElementById('wave-box');
    const npSong = document.getElementById('np-song');
    const npStatus = document.getElementById('np-status');

    // TỰ ĐỘNG TÌM BÀI HÁT TRONG THƯ MỤC AUDIO TRÊN GITHUB
    async function loadPlaylistFromGithub() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/audio`);
        const files = await res.json();

        if (Array.isArray(files)) {
          playlist = files
            .filter(file => file.name.endsWith('.mp3'))
            .map(file => ({
              title: file.name.replace('.mp3', ''),
              src: `./audio/${encodeURIComponent(file.name)}`
            }));

          if (playlist.length > 0) {
            loadTrack(currentTrack);
          } else {
            npSong.innerText = "Không thấy bài hát nào";
          }
        }
      } catch (err) {
        console.error("Lỗi đọc thư mục audio:", err);
        npSong.innerText = "Lỗi kết nối bài hát";
      }
    }

    function loadTrack(index) {
      if (playlist[index]) {
        audio.src = playlist[index].src;
        npSong.innerText = playlist[index].title;
      }
    }

    function playAudio() {
      if (!playlist.length) return;
      audio.play().then(() => {
        playIcon.className = "fa-solid fa-pause";
        waveBox.classList.remove('paused');
        npStatus.innerText = "Now playing";
      }).catch(err => console.log("Cần tương tác để phát nhạc:", err));
    }

    function pauseAudio() {
      audio.pause();
      playIcon.className = "fa-solid fa-play";
      waveBox.classList.add('paused');
      npStatus.innerText = "Paused";
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        playAudio();
      } else {
        pauseAudio();
      }
    });

    nextBtn.addEventListener('click', () => {
      if (!playlist.length) return;
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playAudio();
    });

    audio.addEventListener('ended', () => {
      if (!playlist.length) return;
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playAudio();
    });

    // CẬP NHẬT DISCORD PROFILE
    async function updateDiscordData() {
      const nameElem = document.getElementById('discord-username');
      const avatarElem = document.getElementById('discord-avatar');
      const statusDot = document.getElementById('status-dot');
      const decoElem = document.getElementById('avatar-deco');
      const guildTagElem = document.getElementById('guild-tag');
      const guildNameElem = document.getElementById('guild-name');

      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const result = await response.json();

        if (result.success && result.data) {
          const data = result.data;
          const user = data.discord_user;

          const nameToDisplay = user.global_name || user.username;
          nameElem.innerText = nameToDisplay;
          document.title = `${nameToDisplay} - Profile`;

          if (user.avatar) {
            const isGif = user.avatar.startsWith('a_');
            const ext = isGif ? 'gif' : 'png';
            avatarElem.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
          }

          if (user.avatar_decoration_data) {
            const decoHash = user.avatar_decoration_data.asset;
            decoElem.src = `https://cdn.discordapp.com/avatar-decoration-presets/${decoHash}.png`;
            decoElem.style.display = 'block';
          } else {
            decoElem.style.display = 'none';
          }

          if (data.clan && data.clan.tag) {
            guildNameElem.innerText = data.clan.tag;
            guildTagElem.style.display = 'inline-flex';
          } else {
            guildTagElem.style.display = 'none';
          }

          statusDot.className = 'status-badge';
          statusDot.classList.add(`status-${data.discord_status}`);
        }
      } catch (err) {
        console.error("Lỗi Lanyard API:", err);
      }
    }

    loadPlaylistFromGithub();
    updateDiscordData();
    setInterval(updateDiscordData, 10000);
  </script>
</body>
</html>
