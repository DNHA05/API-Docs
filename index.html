<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#07070a">
  <title>Discord Verification</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: #07070a;
      color: #fff;
    }
    body {
      overflow-x: hidden;
    }
    /* Background */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(88, 101, 242, 0.22),
          transparent 30%
        ),
        radial-gradient(
          circle at 80% 75%,
          rgba(124, 58, 237, 0.18),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #07070a,
          #101018 55%,
          #09090c
        );
    }
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.18;
      pointer-events: none;
    }
    .orb.one {
      width: 220px;
      height: 220px;
      background: #5865f2;
      top: 8%;
      left: 4%;
    }
    .orb.two {
      width: 280px;
      height: 280px;
      background: #8b5cf6;
      right: -80px;
      bottom: 5%;
    }
    /* Main */
    .wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    /* Card */
    .card {
      width: min(470px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.11);
      background: rgba(13, 13, 18, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      padding: 34px;
      box-shadow:
        0 30px 100px rgba(0, 0, 0, 0.45);
    }
    /* Logo */
    .logo {
      width: 70px;
      height: 70px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background:
        linear-gradient(
          135deg,
          #5865f2,
          #7c3aed
        );
      box-shadow:
        0 12px 40px rgba(88, 101, 242, 0.35);
      font-size: 32px;
      font-weight: 900;
    }
    /* Title */
    h1 {
      text-align: center;
      font-size: 30px;
      margin: 0 0 10px;
      letter-spacing: -0.7px;
    }
    .sub {
      text-align: center;
      color: #a1a1aa;
      line-height: 1.6;
      margin: 0 auto 26px;
      max-width: 360px;
    }
    /* User */
    .user {
      display: none;
      align-items: center;
      gap: 13px;
      padding: 12px;
      border:
        1px solid rgba(255, 255, 255, 0.09);
      background:
        rgba(255, 255, 255, 0.035);
      border-radius: 17px;
      margin-bottom: 18px;
    }
    .user img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user strong {
      display: block;
      font-size: 14px;
    }
    .user span {
      display: block;
      color: #8f8f99;
      font-size: 12px;
      margin-top: 3px;
    }
    /* Buttons */
    .btn {
      width: 100%;
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      text-decoration: none;
    }
    .login {
      background: #5865f2;
      color: white;
      box-shadow:
        0 10px 30px rgba(88, 101, 242, 0.25);
    }
    .login:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }
    .verify {
      background:
        linear-gradient(
          135deg,
          #5865f2,
          #7c3aed
        );
      color: #fff;
      display: none;
    }
    .verify:hover {
      transform: translateY(-2px);
    }
    .verify:disabled {
      opacity: 0.6;
      cursor: wait;
      transform: none;
    }
    .logout {
      background: transparent;
      color: #9a9aa3;
      border:
        1px solid rgba(255, 255, 255, 0.09);
      margin-top: 10px;
      display: none;
    }
    .logout:hover {
      background:
        rgba(255, 255, 255, 0.04);
      color: #fff;
    }
    /* Status */
    .status {
      display: none;
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
    }
    .status.show {
      display: block;
    }
    .status.ok {
      background:
        rgba(34, 197, 94, 0.09);
      border:
        1px solid rgba(34, 197, 94, 0.22);
      color: #86efac;
    }
    .status.err {
      background:
        rgba(239, 68, 68, 0.09);
      border:
        1px solid rgba(239, 68, 68, 0.22);
      color: #fca5a5;
    }
    /* Steps */
    .steps {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);
      gap: 8px;
      margin-top: 25px;
    }
    .step {
      padding: 11px 8px;
      border:
        1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      text-align: center;
      color: #8d8d97;
      font-size: 11px;
    }
    .step b {
      display: block;
      color: #fff;
      font-size: 17px;
      margin-bottom: 4px;
    }
    /* Footer */
    footer {
      text-align: center;
      color: #666672;
      font-size: 11px;
      margin-top: 22px;
    }
    /* Mobile */
    @media (max-width: 480px) {
      .card {
        padding: 27px 20px;
        border-radius: 23px;
      }
      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>
  <main class="wrap">
    <section class="card">
      <!-- Logo -->
      <div class="logo">
        ✓
      </div>
      <!-- Title -->
      <h1>
        Xác minh Discord
      </h1>
      <p class="sub">
        Đăng nhập Discord để xác minh tài khoản
        và nhận role tự động.
      </p>
      <!-- User information -->
      <div class="user" id="userBox">
        <img
          id="avatar"
          src=""
          alt="Avatar"
        >
        <div>
          <strong id="name"></strong>
          <span id="id"></span>
        </div>
      </div>
      <!-- Login -->
      <a
        class="btn login"
        id="login"
        href="/auth"
      >
        ◉ &nbsp; Đăng nhập với Discord
      </a>
      <!-- Verify -->
      <button
        class="btn verify"
        id="verify"
      >
        ✓ &nbsp; Xác minh & nhận Role
      </button>
      <!-- Logout -->
      <button
        class="btn logout"
        id="logout"
      >
        Đăng xuất
      </button>
      <!-- Status -->
      <div
        class="status"
        id="status"
      ></div>
      <!-- Steps -->
      <div class="steps">
        <div class="step">
          <b>01</b>
          Đăng nhập
        </div>
        <div class="step">
          <b>02</b>
          Xác minh
        </div>
        <div class="step">
          <b>03</b>
          Nhận Role
        </div>
      </div>
      <footer>
        Discord Verification • Secure OAuth2
      </footer>
    </section>
  </main>
  <script>
    const $ = id =>
      document.getElementById(id);
    const statusBox =
      $("status");
    function status(text, ok = false) {
      statusBox.textContent = text;
      statusBox.className =
        "status show " +
        (ok ? "ok" : "err");
    }
    async function load() {
      try {
        const params =
          new URLSearchParams(
            location.search
          );
        const response =
          await fetch("/api/me");
        const data =
          await response.json();
        if (params.get("error")) {
          status(
            "Đăng nhập bị hủy hoặc xảy ra lỗi. Vui lòng thử lại."
          );
          history.replaceState(
            {},
            "",
            "/"
          );
        }
        if (data.loggedIn) {
          const user =
            data.user;
          $("login")
            .style
            .display = "none";
          $("userBox")
            .style
            .display = "flex";
          $("verify")
            .style
            .display = "flex";
          $("logout")
            .style
            .display = "flex";
          $("avatar")
            .src = user.avatar;
          $("name")
            .textContent =
            user.global_name ||
            user.username;
          $("id")
            .textContent =
            "@" + user.username;
        }
      } catch (error) {
        console.error(error);
        status(
          "Không thể kết nối máy chủ."
        );
      }
    }
    $("verify").onclick =
      async () => {
        $("verify")
          .disabled = true;
        $("verify")
          .textContent =
          "Đang xác minh...";
        try {
          const response =
            await fetch(
              "/api/claim",
              {
                method: "POST"
              }
            );
          const data =
            await response.json();
          if (data.ok) {
            status(
              "✓ " + data.message,
              true
            );
            $("verify")
              .textContent =
              "✓ Đã xác minh";
          } else {
            status(
              data.message ||
              "Xác minh thất bại."
            );
            $("verify")
              .disabled = false;
            $("verify")
              .textContent =
              "✓ Xác minh & nhận Role";
          }
        } catch (error) {
          console.error(error);
          status(
            "Không thể kết nối máy chủ."
          );
          $("verify")
            .disabled = false;
          $("verify")
            .textContent =
            "✓ Xác minh & nhận Role";
        }
      };
    $("logout").onclick =
      async () => {
        await fetch(
          "/logout",
          {
            method: "POST"
          }
        );
        location.href = "/";
      };
    load();
  </script>
</body>
</html>
