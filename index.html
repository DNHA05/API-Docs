<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07080d">

<title>Discord Verify</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#07080d;
    --card:rgba(16,18,28,.72);
    --border:rgba(255,255,255,.09);
    --text:#fff;
    --muted:#858b9e;
    --discord:#5865f2;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    color:var(--text);
    background:var(--bg);
}


/* =========================
   BACKGROUND
========================= */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 50%,
            #11152b 0%,
            #090a11 42%,
            #050509 100%
        );
}

.bg::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            rgba(255,255,255,.015) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.015) 1px,
            transparent 1px
        );
    background-size:50px 50px;
    mask-image:
        radial-gradient(
            circle,
            black,
            transparent 75%
        );
}


/* glowing blobs */

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(90px);
    opacity:.3;
    animation:blob 15s ease-in-out infinite;
}

.blob.one{
    width:420px;
    height:420px;
    background:#4655ff;
    top:-180px;
    left:-130px;
}

.blob.two{
    width:380px;
    height:380px;
    background:#8b43ff;
    right:-160px;
    bottom:-150px;
    animation-delay:-5s;
}

.blob.three{
    width:220px;
    height:220px;
    background:#3148c9;
    left:45%;
    top:55%;
    opacity:.13;
    animation-delay:-9s;
}

@keyframes blob{
    0%,100%{
        transform:translate(0,0) scale(1);
    }

    33%{
        transform:translate(70px,-35px) scale(1.12);
    }

    66%{
        transform:translate(-50px,60px) scale(.9);
    }
}


/* =========================
   TOP BAR
========================= */

.top{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:76px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 32px;

    z-index:20;

    border-bottom:1px solid
        rgba(255,255,255,.045);

    background:
        rgba(5,6,10,.25);

    backdrop-filter:blur(20px);

    animation:topIn .8s ease both;
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
}

.brand-logo{
    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:
        linear-gradient(
            145deg,
            #6874ff,
            #7b42ed
        );

    box-shadow:
        0 7px 25px
        rgba(88,101,242,.28);
}

.brand-logo::before{
    content:"";
    width:15px;
    height:11px;
    border-radius:7px 7px 6px 6px;
    background:white;
}

.brand-text{
    font-size:14px;
    font-weight:700;
    letter-spacing:.2px;
}

.secure{
    display:flex;
    align-items:center;
    gap:7px;

    font-size:11px;
    color:#686e80;
}

.secure-dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:#63d59a;
    box-shadow:0 0 10px #63d59a;
}

@keyframes topIn{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   MAIN
========================= */

main{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:90px 20px 40px;
}


/* =========================
   CARD
========================= */

.card-wrap{
    position:relative;
    width:100%;
    max-width:480px;

    animation:
        cardIn
        1s
        cubic-bezier(.16,1,.3,1)
        both;
}

@keyframes cardIn{
    from{
        opacity:0;
        transform:
            translateY(45px)
            scale(.94);
        filter:blur(10px);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
        filter:blur(0);
    }
}


/* glow behind */

.card-glow{
    position:absolute;
    inset:35px -20px -30px;

    border-radius:40px;

    background:
        linear-gradient(
            120deg,
            rgba(88,101,242,.28),
            rgba(137,70,255,.15),
            transparent 70%
        );

    filter:blur(40px);

    animation:
        glowMove
        5s
        ease-in-out
        infinite;
}

@keyframes glowMove{
    0%,100%{
        opacity:.5;
        transform:scale(.95);
    }

    50%{
        opacity:.9;
        transform:scale(1.05);
    }
}


/* card */

.card{
    position:relative;

    padding:42px 38px 36px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(23,25,38,.86),
            rgba(10,11,18,.78)
        );

    border:1px solid var(--border);

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.55),

        inset 0 1px 0
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(28px);

    overflow:hidden;
}


/* animated border */

.card::before{
    content:"";

    position:absolute;
    inset:-1px;

    border-radius:31px;

    padding:1px;

    background:
        linear-gradient(
            120deg,
            transparent 20%,
            rgba(112,126,255,.55),
            transparent 45%,
            rgba(151,76,255,.45),
            transparent 70%
        );

    background-size:300% 300%;

    animation:borderMove 7s linear infinite;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite:xor;

    mask-composite:exclude;

    pointer-events:none;
}

@keyframes borderMove{
    from{
        background-position:0% 50%;
    }

    to{
        background-position:300% 50%;
    }
}


/* light reflection */

.card::after{
    content:"";

    position:absolute;

    width:240px;
    height:240px;

    top:-180px;
    right:-80px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(120,135,255,.18),
            transparent 70%
        );

    pointer-events:none;
}


/* =========================
   ICON
========================= */

.icon-area{
    display:flex;
    justify-content:center;

    margin-bottom:28px;
}

.icon{
    position:relative;

    width:82px;
    height:82px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:25px;

    background:
        linear-gradient(
            145deg,
            #6673ff,
            #5947e9 55%,
            #8249ed
        );

    box-shadow:
        0 20px 45px
        rgba(88,101,242,.30),

        inset 0 1px 1px
        rgba(255,255,255,.35);

    animation:
        iconFloat
        4s
        ease-in-out
        infinite,

        iconIn
        .8s
        .2s
        cubic-bezier(.16,1,.3,1)
        both;
}

.icon::before{
    content:"";

    position:absolute;
    inset:1px;

    border-radius:24px;

    border:1px solid
        rgba(255,255,255,.18);
}

.icon::after{
    content:"";

    position:absolute;

    width:130px;
    height:40px;

    top:-20px;
    left:-30px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform:rotate(-35deg);

    animation:
        iconShine
        4s
        1s
        infinite;
}

@keyframes iconFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}

@keyframes iconIn{
    from{
        opacity:0;
        transform:scale(.5) rotate(-12deg);
    }

    to{
        opacity:1;
        transform:scale(1) rotate(0);
    }
}

@keyframes iconShine{
    0%,45%{
        transform:
            translateX(-100%)
            rotate(-35deg);
    }

    70%,100%{
        transform:
            translateX(130%)
            rotate(-35deg);
    }
}


/* discord symbol */

.discord{
    position:relative;
    width:45px;
    height:32px;
    z-index:2;

    border-radius:
        14px 14px 12px 12px;

    background:white;
}

.discord::before{
    content:"";

    position:absolute;

    width:7px;
    height:7px;

    top:11px;
    left:10px;

    border-radius:50%;

    background:#636bef;

    box-shadow:
        18px 0 0 #636bef;
}

.discord::after{
    content:"";

    position:absolute;

    width:27px;
    height:8px;

    left:9px;
    bottom:-3px;

    border-radius:
        0 0 15px 15px;

    background:white;
}


/* =========================
   TEXT
========================= */

.badge{
    width:max-content;
    margin:0 auto 14px;

    padding:6px 11px;

    border-radius:999px;

    color:#9ca6ff;

    background:
        rgba(88,101,242,.08);

    border:1px solid
        rgba(111,124,255,.13);

    font-size:10px;
    font-weight:700;

    letter-spacing:.8px;

    text-transform:uppercase;

    animation:fadeUp .7s .45s both;
}

h1{
    text-align:center;

    font-size:
        clamp(35px,8vw,46px);

    line-height:1.05;

    letter-spacing:-2px;

    font-weight:850;

    margin-bottom:15px;

    background:
        linear-gradient(
            100deg,
            #fff,
            #dfe3ff 45%,
            #9da8ff
        );

    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;

    animation:fadeUp .7s .55s both;
}

.description{
    text-align:center;

    max-width:370px;

    margin:0 auto;

    color:var(--muted);

    font-size:14px;

    line-height:1.7;

    animation:fadeUp .7s .65s both;
}


/* =========================
   BUTTON
========================= */

.button{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    width:100%;
    height:62px;

    margin-top:30px;

    border-radius:17px;

    overflow:hidden;

    text-decoration:none;

    color:#fff;

    background:
        linear-gradient(
            110deg,
            #5865f2,
            #6956ed,
            #8050e9,
            #5865f2
        );

    background-size:300% 100%;

    box-shadow:
        0 15px 40px
        rgba(88,101,242,.25),

        inset 0 1px 0
        rgba(255,255,255,.22);

    font-size:15px;
    font-weight:800;

    animation:
        fadeUp
        .7s
        .8s
        both,

        gradientMove
        6s
        1s
        linear
        infinite;

    transition:
        transform .25s,
        box-shadow .25s;
}

.button:hover{
    transform:translateY(-4px);

    box-shadow:
        0 23px 55px
        rgba(88,101,242,.38);
}

.button:active{
    transform:scale(.97);
}


/* shine */

.button::before{
    content:"";

    position:absolute;

    top:-50%;
    left:-100%;

    width:60%;
    height:200%;

    transform:rotate(20deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.28),
            transparent
        );

    animation:
        buttonShine
        4s
        2s
        infinite;
}

@keyframes buttonShine{
    0%,50%{
        left:-100%;
    }

    75%,100%{
        left:150%;
    }
}

@keyframes gradientMove{
    from{
        background-position:0% 50%;
    }

    to{
        background-position:300% 50%;
    }
}

.button-content{
    position:relative;
    z-index:2;

    display:flex;
    align-items:center;
    gap:11px;
}

.button-icon{
    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:8px;

    background:
        rgba(255,255,255,.17);
}

.arrow{
    position:absolute;
    right:19px;

    font-size:20px;

    opacity:.7;

    transition:
        transform .25s;
}

.button:hover .arrow{
    transform:translateX(5px);
}


/* =========================
   INFO
========================= */

.info{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:8px;

    margin-top:13px;

    animation:
        fadeUp
        .7s
        1s
        both;
}

.info-item{
    padding:12px 5px;

    text-align:center;

    border-radius:13px;

    background:
        rgba(255,255,255,.025);

    border:1px solid
        rgba(255,255,255,.055);
}

.info-icon{
    margin-bottom:4px;

    color:#8792ff;

    font-size:13px;
}

.info-text{
    color:#62697b;

    font-size:9px;

    font-weight:600;
}


/* =========================
   FOOTER
========================= */

.footer{
    text-align:center;

    margin-top:25px;

    color:#515767;

    font-size:10px;

    animation:
        fadeUp
        .7s
        1.1s
        both;
}

.footer span{
    color:#737b90;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .top{
        height:66px;
        padding:0 18px;
    }

    .secure{
        font-size:9px;
    }

    main{
        padding:
            80px 15px
            30px;
    }

    .card{
        padding:
            34px 23px
            28px;

        border-radius:26px;
    }

    .icon{
        width:76px;
        height:76px;
        border-radius:23px;
    }

    h1{
        font-size:37px;
    }

    .description{
        font-size:13px;
    }

    .button{
        height:58px;
        border-radius:16px;
    }

    .info{
        margin-top:10px;
    }

    .info-item{
        padding:10px 3px;
    }

    .footer{
        margin-top:20px;
    }
}


/* =========================
   SMALL IPHONE
========================= */

@media(max-height:700px){

    main{
        padding-top:72px;
    }

    .card{
        padding-top:27px;
        padding-bottom:23px;
    }

    .icon-area{
        margin-bottom:18px;
    }

    .icon{
        width:65px;
        height:65px;
        border-radius:20px;
    }

    .discord{
        transform:scale(.8);
    }

    h1{
        font-size:33px;
        margin-bottom:10px;
    }

    .description{
        line-height:1.5;
    }

    .button{
        margin-top:20px;
    }

    .info{
        display:none;
    }

    .footer{
        margin-top:15px;
    }
}


/* =========================
   REDUCE MOTION
========================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation:none!important;
        transition:none!important;
    }
}

</style>
</head>

<body>

<div class="bg">
    <div class="blob one"></div>
    <div class="blob two"></div>
    <div class="blob three"></div>
</div>


<header class="top">

    <div class="brand">

        <div class="brand-logo"></div>

        <div class="brand-text">
            Discord Verification
        </div>

    </div>

    <div class="secure">

        <div class="secure-dot"></div>

        Secure connection

    </div>

</header>


<main>

    <div class="card-wrap">

        <div class="card-glow"></div>

        <section class="card">


            <div class="icon-area">

                <div class="icon">

                    <div class="discord"></div>

                </div>

            </div>


            <div class="badge">
                Official Verification
            </div>


            <h1>
                Xác minh tài khoản
            </h1>


            <p class="description">

                Kết nối Discord của bạn để hoàn tất
                quá trình xác minh và tiếp tục.

            </p>


            <a
                href="/auth"
                class="button"
            >

                <div class="button-content">

                    <div class="button-icon">
                        ◎
                    </div>

                    <span>
                        Tiếp tục với Discord
                    </span>

                </div>

                <div class="arrow">
                    →
                </div>

            </a>


            <div class="info">

                <div class="info-item">

                    <div class="info-icon">
                        ✓
                    </div>

                    <div class="info-text">
                        BẢO MẬT
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        ◇
                    </div>

                    <div class="info-text">
                        OAUTH2
                    </div>

                </div>


                <div class="info-item">

                    <div class="info-icon">
                        ⌁
                    </div>

                    <div class="info-text">
                        NHANH
                    </div>

                </div>

            </div>


            <div class="footer">

                Discord Verification
                <span>•</span>
                Secure OAuth2

            </div>

        </section>

    </div>

</main>


<script>

/* ==========================================
   BUTTON RIPPLE
========================================== */

const button =
    document.querySelector(".button");

button.addEventListener(
    "pointerdown",
    function(e){

        const rect =
            button.getBoundingClientRect();

        const ripple =
            document.createElement("span");

        const size =
            Math.max(
                rect.width,
                rect.height
            );

        ripple.style.position =
            "absolute";

        ripple.style.width =
            size + "px";

        ripple.style.height =
            size + "px";

        ripple.style.left =
            (e.clientX - rect.left - size/2)
            + "px";

        ripple.style.top =
            (e.clientY - rect.top - size/2)
            + "px";

        ripple.style.borderRadius =
            "50%";

        ripple.style.background =
            "rgba(255,255,255,.18)";

        ripple.style.transform =
            "scale(0)";

        ripple.style.pointerEvents =
            "none";

        ripple.style.zIndex =
            "1";

        ripple.style.transition =
            "transform .55s ease, opacity .55s ease";

        button.appendChild(ripple);

        requestAnimationFrame(() => {

            ripple.style.transform =
                "scale(1.4)";

            ripple.style.opacity =
                "0";

        });

        setTimeout(
            () => ripple.remove(),
            600
        );
    }
);


/* ==========================================
   MOBILE TOUCH GLOW
========================================== */

document.addEventListener(
    "touchmove",
    e => {

        const touch =
            e.touches[0];

        if(!touch) return;

        document.documentElement.style
            .setProperty(
                "--touch-x",
                touch.clientX + "px"
            );

        document.documentElement.style
            .setProperty(
                "--touch-y",
                touch.clientY + "px"
            );
    },
    {passive:true}
);

</script>

</body>
</html>
