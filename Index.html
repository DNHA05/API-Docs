<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05050a">

<title>Discord Verification</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --discord: #5865f2;
    --purple: #8b5cf6;
    --pink: #ec4899;
    --cyan: #06b6d4;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #05050a;
    color: white;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

.bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(88,101,242,.20),
            transparent 35%
        ),
        #05050a;
}


/* Aurora */

.aurora {
    position: absolute;

    width: 500px;
    height: 500px;

    border-radius: 50%;

    filter: blur(100px);

    opacity: .18;

    animation:
        auroraMove 12s ease-in-out infinite;
}

.aurora.a {
    left: -250px;
    top: -100px;

    background: #5865f2;
}

.aurora.b {
    right: -250px;
    bottom: -120px;

    background: #8b5cf6;

    animation-delay: -4s;
}

.aurora.c {
    left: 35%;
    top: 45%;

    width: 280px;
    height: 280px;

    background: #ec4899;

    opacity: .07;

    animation-delay: -7s;
}

@keyframes auroraMove {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    25% {
        transform:
            translate(100px,60px)
            scale(1.15);
    }

    50% {
        transform:
            translate(-30px,120px)
            scale(.9);
    }

    75% {
        transform:
            translate(-80px,30px)
            scale(1.12);
    }

    100% {
        transform:
            translate(0,0)
            scale(1);
    }
}


/* Grid */

.grid {
    position: absolute;
    inset: 0;

    opacity: .08;

    background-image:
        linear-gradient(
            rgba(255,255,255,.06) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.06) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black,
            transparent 75%
        );

    animation:
        gridMove 15s linear infinite;
}

@keyframes gridMove {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(45px);
    }
}


/* =====================================================
   PARTICLES
===================================================== */

.particles {
    position: absolute;
    inset: 0;
}

.dot {
    position: absolute;

    width: 2px;
    height: 2px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 8px #8b9cff;

    animation:
        rise linear infinite;
}

@keyframes rise {

    from {
        transform:
            translateY(110vh)
            translateX(0);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    90% {
        opacity: .5;
    }

    to {
        transform:
            translateY(-15vh)
            translateX(80px);
        opacity: 0;
    }
}


/* =====================================================
   PAGE
===================================================== */

.page {
    position: relative;
    z-index: 5;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 22px;
}


/* =====================================================
   CARD
===================================================== */

.card {
    position: relative;

    width: min(470px, 100%);

    padding: 34px 30px 27px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(17,17,27,.90),
            rgba(7,7,13,.82)
        );

    border:
        1px solid
        rgba(255,255,255,.11);

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.65),

        0 0 80px
        rgba(88,101,242,.08);

    overflow: hidden;

    animation:
        cardIn .9s
        cubic-bezier(.16,1,.3,1);
}


/* Animated border */

.card::before {
    content: "";

    position: absolute;
    inset: -2px;

    border-radius: 32px;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            #5865f2,
            transparent,
            #ec4899,
            transparent,
            #06b6d4,
            transparent
        );

    animation:
        rotateBorder 7s linear infinite;

    opacity: .45;

    z-index: -2;
}

.card::after {
    content: "";

    position: absolute;
    inset: 1px;

    border-radius: 29px;

    background:
        linear-gradient(
            145deg,
            rgba(17,17,27,.97),
            rgba(7,7,13,.94)
        );

    z-index: -1;
}

@keyframes rotateBorder {

    to {
        transform: rotate(360deg);
    }
}

@keyframes cardIn {

    from {
        opacity: 0;

        transform:
            translateY(55px)
            scale(.90);

        filter: blur(12px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);
    }
}


/* =====================================================
   TOP LINE
===================================================== */

.top-line {
    position: absolute;

    top: 0;
    left: 10%;

    width: 80%;
    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #5865f2,
            #ec4899,
            #06b6d4,
            transparent
        );

    box-shadow:
        0 0 15px
        rgba(88,101,242,.7);

    animation:
        linePulse 3s ease-in-out infinite;
}

@keyframes linePulse {

    0%,
    100% {
        opacity: .3;
        transform: scaleX(.7);
    }

    50% {
        opacity: 1;
        transform: scaleX(1);
    }
}


/* =====================================================
   LOGO
===================================================== */

.logo-area {
    position: relative;

    width: 110px;
    height: 110px;

    margin:
        0 auto 18px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;
}

.logo {
    position: relative;

    width: 76px;
    height: 76px;

    border-radius: 24px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;

    font-size: 38px;
    font-weight: 900;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #7657f6,
            #9b51ed
        );

    box-shadow:
        0 15px 45px
        rgba(88,101,242,.40);

    animation:
        logoFloat 4s ease-in-out infinite;
}


/* Logo rings */

.ring {
    position: absolute;

    border-radius: 50%;

    border:
        1px solid
        rgba(120,130,255,.35);
}

.ring.r1 {
    width: 88px;
    height: 88px;

    animation:
        ringPulse 2.5s infinite;
}

.ring.r2 {
    width: 106px;
    height: 106px;

    animation:
        ringPulse 2.5s
        .8s
        infinite;
}

.ring.r3 {
    width: 124px;
    height: 124px;

    animation:
        ringPulse 2.5s
        1.6s
        infinite;
}

@keyframes ringPulse {

    0% {
        opacity: .65;
        transform: scale(.75);
    }

    100% {
        opacity: 0;
        transform: scale(1);
    }
}

@keyframes logoFloat {

    0%,
    100% {
        transform:
            translateY(0)
            rotate(0);
    }

    50% {
        transform:
            translateY(-7px)
            rotate(2deg);
    }
}


/* Shine */

.logo-shine {
    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        linear-gradient(
            110deg,
            transparent 20%,
            rgba(255,255,255,.35),
            transparent 70%
        );

    transform:
        translateX(-120%);

    animation:
        logoShine 4s infinite;
}

@keyframes logoShine {

    0%,
    55% {
        transform:
            translateX(-120%);
    }

    80%,
    100% {
        transform:
            translateX(120%);
    }
}


/* =====================================================
   TITLE
===================================================== */

.title {
    text-align: center;

    font-size: 32px;

    font-weight: 900;

    letter-spacing: -1.2px;

    line-height: 1.15;

    background:
        linear-gradient(
            90deg,

            #5865f2,
            #8b5cf6,
            #ec4899,
            #06b6d4,
            #22c55e,
            #facc15,
            #5865f2
        );

    background-size: 500% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        rainbow 6s linear infinite,
        titleGlow 2.5s ease-in-out infinite alternate,
        titleIn .7s .25s both;
}

@keyframes rainbow {

    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 500% 50%;
    }
}

@keyframes titleGlow {

    from {
        filter:
            drop-shadow(
                0 0 2px
                rgba(88,101,242,.2)
            );
    }

    to {
        filter:
            drop-shadow(
                0 0 14px
                rgba(139,92,246,.55)
            );
    }
}

@keyframes titleIn {

    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* =====================================================
   SUBTITLE
===================================================== */

.subtitle {
    max-width: 370px;

    margin:
        14px auto 28px;

    text-align: center;

    color: #a7a7b2;

    font-size: 14px;

    line-height: 1.7;

    animation:
        fadeUp .7s .4s both;
}

.subtitle span {
    background:
        linear-gradient(
            90deg,
            #a1a1aa,
            #d8d8ff,
            #c4b5fd,
            #f5d0fe,
            #a1a1aa
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        rainbow 7s linear infinite;
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.button {
    position: relative;

    width: 100%;

    min-height: 57px;

    border: none;

    border-radius: 17px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap: 10px;

    color: white;

    text-decoration: none;

    font-size: 15px;

    font-weight: 800;

    cursor: pointer;

    overflow: hidden;

    transition:
        transform .25s,
        box-shadow .25s,
        filter .25s;
}

.login {
    background:
        linear-gradient(
            100deg,
            #5865f2,
            #7657f6,
            #a855f7,
            #5865f2
        );

    background-size: 300% 100%;

    box-shadow:
        0 15px 35px
        rgba(88,101,242,.28);

    animation:
        gradientButton 5s linear infinite,
        fadeUp .7s .55s both;
}

.login:hover {
    transform:
        translateY(-4px)
        scale(1.01);

    filter:
        brightness(1.1);

    box-shadow:
        0 20px 55px
        rgba(88,101,242,.45);
}


/* Button shine */

.button::before {
    content: "";

    position: absolute;

    top: 0;
    left: -120%;

    width: 60%;
    height: 100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:
        skewX(-20deg);

    animation:
        buttonShine 4s infinite;
}

@keyframes buttonShine {

    0%,
    55% {
        left: -120%;
    }

    80%,
    100% {
        left: 150%;
    }
}

@keyframes gradientButton {

    0% {
        background-position: 0% 50%;
    }

    100% {
        background-position: 300% 50%;
    }
}


/* =====================================================
   USER
===================================================== */

.user {
    display: none;

    align-items: center;

    gap: 12px;

    padding: 12px;

    margin-bottom: 16px;

    border-radius: 16px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    animation:
        fadeUp .4s both;
}

.user img {
    width: 44px;
    height: 44px;

    border-radius: 50%;

    border:
        2px solid
        rgba(88,101,242,.5);

    box-shadow:
        0 0 20px
        rgba(88,101,242,.3);
}

.user strong {
    display: block;

    font-size: 14px;
}

.user small {
    display: block;

    color: #888894;

    margin-top: 3px;
}


/* =====================================================
   VERIFY
===================================================== */

.verify {
    display: none;

    margin-top: 0;

    background:
        linear-gradient(
            100deg,
            #5865f2,
            #8b5cf6,
            #ec4899,
            #5865f2
        );

    background-size: 300% 100%;

    animation:
        gradientButton 5s linear infinite;
}

.verify:disabled {
    opacity: .65;

    cursor: wait;
}


/* =====================================================
   LOGOUT
===================================================== */

.logout {
    display: none;

    margin-top: 10px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    color: #9999a5;
}

.logout:hover {
    background:
        rgba(255,255,255,.07);

    color: white;
}


/* =====================================================
   STATUS
===================================================== */

.status {
    display: none;

    margin-top: 15px;

    padding: 14px 15px;

    border-radius: 15px;

    font-size: 13px;

    line-height: 1.5;

    animation:
        statusIn .4s both;
}

.status.show {
    display: block;
}

.status.ok {
    color: #86efac;

    background:
        rgba(34,197,94,.08);

    border:
        1px solid
        rgba(34,197,94,.22);

    box-shadow:
        0 0 25px
        rgba(34,197,94,.06);
}

.status.err {
    color: #fca5a5;

    background:
        rgba(239,68,68,.08);

    border:
        1px solid
        rgba(239,68,68,.22);
}

@keyframes statusIn {

    from {
        opacity: 0;
        transform:
            translateY(-8px)
            scale(.98);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   STEPS
===================================================== */

.steps {
    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 8px;

    margin-top: 25px;
}

.step {
    position: relative;

    padding:
        14px 6px;

    text-align: center;

    border-radius: 16px;

    background:
        rgba(255,255,255,.018);

    border:
        1px solid
        rgba(255,255,255,.07);

    color: #81818c;

    font-size: 11px;

    overflow: hidden;

    animation:
        stepIn .6s both;
}

.step:nth-child(1) {
    animation-delay: .70s;
}

.step:nth-child(2) {
    animation-delay: .82s;
}

.step:nth-child(3) {
    animation-delay: .94s;
}

.step::after {
    content: "";

    position: absolute;

    width: 100%;
    height: 1px;

    left: -100%;
    bottom: 0;

    background:
        linear-gradient(
            90deg,
            transparent,
            #5865f2,
            transparent
        );

    animation:
        stepLine 4s linear infinite;
}

.step:nth-child(2)::after {
    animation-delay: .8s;
}

.step:nth-child(3)::after {
    animation-delay: 1.6s;
}

.step b {
    display: block;

    margin-bottom: 6px;

    font-size: 19px;

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            #5865f2,
            #ec4899,
            #06b6d4,
            #5865f2
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        rainbow 5s linear infinite;
}

@keyframes stepLine {

    from {
        left: -100%;
    }

    to {
        left: 100%;
    }
}

@keyframes stepIn {

    from {
        opacity: 0;
        transform:
            translateY(15px)
            scale(.95);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    margin-top: 22px;

    text-align: center;

    font-size: 11px;

    color: #666673;

    animation:
        fadeUp .7s 1s both;
}

.footer span {
    background:
        linear-gradient(
            90deg,
            #666673,
            #aaaabc,
            #8b5cf6,
            #666673
        );

    background-size: 300% 100%;

    -webkit-background-clip: text;
    background-clip: text;

    -webkit-text-fill-color: transparent;

    animation:
        rainbow 8s linear infinite;
}


/* =====================================================
   COMMON
===================================================== */

@keyframes fadeUp {

    from {
        opacity: 0;
        transform:
            translateY(16px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .page {
        padding: 15px;
    }

    .card {
        padding:
            30px 20px 24px;

        border-radius: 25px;
    }

    .title {
        font-size: 28px;
    }

    .subtitle {
        font-size: 14px;
    }

    .logo-area {
        margin-bottom: 14px;
    }

    .steps {
        gap: 6px;
    }

    .step {
        font-size: 10px;
    }
}


/* =====================================================
   REDUCE MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
    }
}

</style>
</head>


<body>

<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="bg">

    <div class="aurora a"></div>
    <div class="aurora b"></div>
    <div class="aurora c"></div>

    <div class="grid"></div>

    <div
        class="particles"
        id="particles"
    ></div>

</div>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">

<section class="card">

    <div class="top-line"></div>

    <!-- LOGO -->

    <div class="logo-area">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <div class="logo">

            ✓

            <div class="logo-shine"></div>

        </div>

    </div>


    <!-- TITLE -->

    <h1 class="title">
        Xác minh Discord
    </h1>


    <!-- DESCRIPTION -->

    <p class="subtitle">

        <span>
            Đăng nhập Discord để xác minh tài khoản
            và nhận role tự động.
        </span>

    </p>


    <!-- USER -->

    <div
        class="user"
        id="userBox"
    >

        <img
            id="avatar"
            src=""
            alt="Avatar"
        >

        <div>

            <strong
                id="name"
            ></strong>

            <small
                id="id"
            ></small>

        </div>

    </div>


    <!-- LOGIN -->

    <a
        href="/auth"
        class="button login"
        id="login"
    >

        <span>◉</span>

        <span>
            Đăng nhập với Discord
        </span>

    </a>


    <!-- VERIFY -->

    <button
        class="button verify"
        id="verify"
    >

        <span>✓</span>

        <span>
            Xác minh & nhận Role
        </span>

    </button>


    <!-- LOGOUT -->

    <button
        class="button logout"
        id="logout"
    >
        Đăng xuất
    </button>


    <!-- STATUS -->

    <div
        class="status"
        id="status"
    ></div>


    <!-- STEPS -->

    <div class="steps">

        <div class="step">

            <b>01</b>

            Đăng nhập

        </div>


        <div class="step">

            <b>02</b>

            Xác minh

        </div>


        <div class="step">

            <b>03</b>

            Nhận Role

        </div>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        <span>
            Discord Verification • Secure OAuth2
        </span>

    </div>

</section>

</main>


<script>

/* =====================================================
   PARTICLES
===================================================== */

const particles =
    document.getElementById(
        "particles"
    );


for (
    let i = 0;
    i < 45;
    i++
) {

    const dot =
        document.createElement(
            "div"
        );

    dot.className =
        "dot";

    dot.style.left =
        Math.random() * 100 + "%";

    dot.style.animationDuration =
        (
            8 +
            Math.random() * 14
        ) + "s";

    dot.style.animationDelay =
        (
            -Math.random() * 15
        ) + "s";

    const size =
        1 +
        Math.random() * 2.5;

    dot.style.width =
        size + "px";

    dot.style.height =
        size + "px";

    particles.appendChild(
        dot
    );
}


/* =====================================================
   ELEMENTS
===================================================== */

const $ =
    id =>
        document.getElementById(id);


const statusBox =
    $("status");


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message,
    success = false
) {

    statusBox.textContent =
        message;

    statusBox.className =
        "status show " +
        (
            success
                ? "ok"
                : "err"
        );
}


/* =====================================================
   GET DISCORD USER
===================================================== */

async function loadUser() {

    try {

        const response =
            await fetch(
                "/api/me",
                {
                    credentials:
                        "include"
                }
            );


        if (!response.ok) {
            return;
        }


        const data =
            await response.json();


        const params =
            new URLSearchParams(
                location.search
            );


        if (
            params.get("error")
        ) {

            showStatus(
                "Đăng nhập bị hủy hoặc xảy ra lỗi."
            );

            history.replaceState(
                {},
                "",
                "/"
            );

        }


        if (
            data.loggedIn &&
            data.user
        ) {

            const user =
                data.user;


            $("login")
                .style
                .display =
                "none";


            $("userBox")
                .style
                .display =
                "flex";


            $("verify")
                .style
                .display =
                "flex";


            $("logout")
                .style
                .display =
                "flex";


            $("avatar")
                .src =
                user.avatar || "";


            $("name")
                .textContent =
                user.global_name ||
                user.username ||
                "Discord User";


            $("id")
                .textContent =
                "@" +
                (
                    user.username ||
                    ""
                );

        }

    }
    catch (error) {

        console.error(
            "API error:",
            error
        );

        /*
         * GitHub Pages không có
         * /api/me nên không cần
         * hiện lỗi ngay khi mở trang.
         */

    }

}


/* =====================================================
   VERIFY / CLAIM ROLE
===================================================== */

$("verify").onclick =
async function () {

    const button =
        $("verify");

    const text =
        button.querySelector(
            "span:last-child"
        );


    button.disabled =
        true;

    text.textContent =
        "Đang xác minh...";


    try {

        const response =
            await fetch(
                "/api/claim",
                {
                    method:
                        "POST",

                    credentials:
                        "include",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );


        const data =
            await response.json();


        if (
            data.ok
        ) {

            showStatus(
                "✓ " +
                (
                    data.message ||
                    "Xác minh thành công! Role đã được cấp."
                ),
                true
            );


            text.textContent =
                "Đã xác minh ✓";

        }

        else {

            showStatus(
                data.message ||
                "Không thể xác minh tài khoản."
            );


            button.disabled =
                false;

            text.textContent =
                "Xác minh & nhận Role";

        }

    }

    catch (error) {

        console.error(
            error
        );


        showStatus(
            "Không thể kết nối máy chủ."
        );


        button.disabled =
            false;

        text.textContent =
            "Xác minh & nhận Role";

    }

};


/* =====================================================
   LOGOUT
===================================================== */

$("logout").onclick =
async function () {

    try {

        await fetch(
            "/logout",
            {
                method:
                    "POST",

                credentials:
                    "include"
            }
        );

    }

    catch (error) {

        console.error(
            error
        );

    }

    location.href =
        "/";

};

   START
===================================================== */

loadUser();
